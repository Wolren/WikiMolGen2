[package]
name = "molplate_wasm"
description = "Browser bindings: figure post-processing and wikitext for the page"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# `cdylib` is what wasm-bindgen/wasm-pack turns into molplate_wasm.js + .wasm; `rlib`
# keeps `cargo test` on the native host able to build the crate (the wasm-only code is
# cfg-gated out there).
crate-type = ["cdylib", "rlib"]

# The renderer is not a Rust dependency: patinae's web viewer is vendored as a built
# asset and driven from TypeScript. What is left here is everything that has to run in
# Rust — the PNG framing and the wikitext — which is also what has unit tests.
[dependencies]
molplate_core = { path = "../molplate_core" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
console_error_panic_hook = "0.1.7"

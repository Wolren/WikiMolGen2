# wasm-only build flag: select getrandom's browser backend. A transitive dependency
# (hashbrown/ahash RNG seeding) pulls getrandom, which has no backend on
# wasm32-unknown-unknown and would otherwise fail at runtime. Scoped to the wasm
# target, so native builds (and the unit tests) are unaffected.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']

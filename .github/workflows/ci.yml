name: CI

on:
  push:
    branches: [patinae-rewrite]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p wikimolgen2_core

  build:
    name: wasm and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.130
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo build --release -p wikimolgen2_wasm --target wasm32-unknown-unknown
      - run: wasm-bindgen --target web --out-dir web/pkg target/wasm32-unknown-unknown/release/wikimolgen2_wasm.wasm
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

[workspace]
members = ["crates/molplate_core", "crates/molplate_wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wolren/molplate"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
image = { version = "0.25.10", default-features = false, features = ["png"] }

# There is no renderer dependency here any more. The 3D viewer is patinae's web build,
# consumed by the page as a prebuilt asset (web/public/vendor/patinae), so the Rust
# workspace only carries the parts that must run in Rust: image post-processing and the
# wikitext. See docs/renderer.md for why it is vendored rather than a git dependency.

# A browser bundle is shipped, so favour small code over fastest code.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
